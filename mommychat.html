
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MommyChat - Connect & Share</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fdf2f8; /* pink-50 */
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #fbcfe8; /* pink-200 */
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #f472b6; /* pink-400 */
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* Loading Spinner */
        .spinner {
            border: 3px solid rgba(244, 114, 182, 0.3);
            border-radius: 50%;
            border-top: 3px solid #db2777; /* pink-600 */
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Message pop animation */
        .msg-enter {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.9) translateY(10px);
        }
        @keyframes popIn {
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col text-gray-800 overflow-hidden">

    <!-- Screen: Loading -->
    <div id="screen-loading" class="absolute inset-0 flex flex-col items-center justify-center bg-pink-50 z-50 transition-opacity duration-500">
        <i class="ph-fill ph-baby text-6xl text-pink-500 mb-4 animate-bounce"></i>
        <div class="spinner mb-4"></div>
        <h2 class="text-xl font-bold text-pink-700">Warming up MommyChat...</h2>
    </div>

    <!-- Screen: Profile Setup (Registration/Login Equivalent) -->
    <div id="screen-setup" class="absolute inset-0 flex flex-col items-center justify-center bg-gradient-to-br from-pink-100 to-teal-50 z-40 hidden opacity-0 transition-opacity duration-500">
        <div class="w-full max-w-md p-8 glass-panel rounded-3xl shadow-xl shadow-pink-200/50 mx-4 border border-white">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-pink-400 to-rose-300 rounded-full shadow-lg mb-4 text-white">
                    <i class="ph-fill ph-hands-clapping text-3xl"></i>
                </div>
                <h1 class="text-3xl font-extrabold text-gray-800 mb-2 tracking-tight">Welcome, Mama!</h1>
                <p class="text-gray-500 text-sm">Join our cozy corner of the internet. Tell us what we should call you.</p>
            </div>
            
            <form id="setup-form" class="space-y-6">
                <div>
                    <label for="display-name" class="block text-sm font-semibold text-gray-700 mb-2">Your Display Name</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="ph ph-user text-pink-400 text-lg"></i>
                        </div>
                        <input type="text" id="display-name" required minlength="2" maxlength="20" placeholder="e.g. Sarah_MomOf2" 
                            class="block w-full pl-10 pr-3 py-3 border border-pink-200 rounded-xl focus:ring-2 focus:ring-pink-400 focus:border-pink-400 bg-white shadow-sm placeholder-gray-400 transition-all outline-none">
                    </div>
                </div>
                
                <button type="submit" class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-white bg-gradient-to-r from-pink-500 to-rose-400 hover:from-pink-600 hover:to-rose-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-pink-500 transition-all transform hover:scale-[1.02] active:scale-[0.98]">
                    Join the Chat
                    <i class="ph-bold ph-arrow-right ml-2 text-lg"></i>
                </button>
            </form>
            
            <div class="mt-6 text-center text-xs text-gray-400 flex items-center justify-center gap-2">
                <i class="ph-fill ph-shield-check text-teal-500"></i>
                Secure, seamless authentication enabled.
            </div>
        </div>
    </div>

    <!-- Screen: Main Chat App -->
    <div id="screen-app" class="flex flex-col h-full hidden opacity-0 transition-opacity duration-500 relative">
        
        <!-- Header -->
        <header class="glass-panel border-b border-pink-100 flex-shrink-0 z-20 pt-safe pb-safe shadow-sm">
            <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-pink-400 to-rose-300 rounded-full flex items-center justify-center text-white shadow-inner">
                        <i class="ph-fill ph-baby text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-600 to-rose-500 tracking-tight">MommyChat</h1>
                        <p class="text-xs text-teal-600 font-semibold flex items-center gap-1">
                            <span class="w-2 h-2 rounded-full bg-teal-500 inline-block animate-pulse"></span>
                            Live Feed
                        </p>
                    </div>
                </div>
                <div class="flex items-center gap-2 bg-pink-50 px-3 py-1.5 rounded-full border border-pink-100">
                    <i class="ph-fill ph-user-circle text-pink-400 text-xl"></i>
                    <span id="header-username" class="text-sm font-bold text-gray-700 truncate max-w-[100px]">...</span>
                </div>
            </div>
        </header>

        <!-- Messages Area -->
        <main id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto pb-6 relative scroll-smooth">
            <!-- Messages will be injected here -->
            <div class="text-center text-xs font-semibold text-gray-400 my-4 uppercase tracking-wider">
                Beginning of the conversation
            </div>
        </main>

        <!-- Input Area -->
        <footer class="glass-panel border-t border-pink-100 p-3 pb-safe z-20">
            <div class="max-w-3xl mx-auto relative">
                <form id="message-form" class="flex items-end gap-2 bg-white p-1 pl-4 pr-1 rounded-3xl border border-pink-200 shadow-sm focus-within:ring-2 focus-within:ring-pink-300 focus-within:border-pink-300 transition-all">
                    <textarea id="message-input" rows="1" placeholder="Share something with other moms..." 
                        class="flex-1 py-3 bg-transparent resize-none outline-none text-gray-800 placeholder-gray-400 max-h-32 text-sm leading-relaxed"
                        style="min-height: 44px;"></textarea>
                    
                    <button type="submit" id="send-btn" disabled class="flex-shrink-0 w-10 h-10 rounded-full bg-gradient-to-r from-teal-400 to-teal-500 text-white flex items-center justify-center shadow-md hover:from-teal-500 hover:to-teal-600 disabled:opacity-50 disabled:cursor-not-allowed transition-all transform active:scale-95 mb-0.5">
                        <i class="ph-fill ph-paper-plane-right text-lg"></i>
                    </button>
                </form>
            </div>
        </footer>
        
        <!-- Background decorative elements -->
        <div class="fixed top-20 left-[-10%] w-64 h-64 bg-pink-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 pointer-events-none"></div>
        <div class="fixed bottom-20 right-[-10%] w-72 h-72 bg-teal-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 pointer-events-none"></div>
    </div>

    <!-- Error Modal -->
    <div id="error-modal" class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-50 hidden flex-items-center justify-center opacity-0 transition-opacity">
        <div class="bg-white m-4 p-6 rounded-2xl shadow-2xl max-w-sm w-full transform scale-95 transition-transform" id="error-content">
            <div class="text-center">
                <i class="ph-fill ph-warning-circle text-4xl text-rose-500 mb-3"></i>
                <h3 class="text-lg font-bold text-gray-900 mb-2">Oops!</h3>
                <p id="error-message" class="text-sm text-gray-500 mb-6">Something went wrong.</p>
                <button onclick="hideError()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-2 px-4 rounded-xl transition-colors">
                    Close
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Environment variables provided by immersive
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'mommychat-dev';
        const FIREBASE_CONFIG = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const INITIAL_TOKEN = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // App State
        let app, db, auth;
        let currentUser = null;
        let userProfile = null;
        let messagesUnsubscribe = null;
        let isFirstLoad = true;

        // UI Elements
        const screens = {
            loading: document.getElementById('screen-loading'),
            setup: document.getElementById('screen-setup'),
            app: document.getElementById('screen-app')
        };
        const elements = {
            setupForm: document.getElementById('setup-form'),
            displayNameInput: document.getElementById('display-name'),
            headerUsername: document.getElementById('header-username'),
            messagesContainer: document.getElementById('messages-container'),
            messageForm: document.getElementById('message-form'),
            messageInput: document.getElementById('message-input'),
            sendBtn: document.getElementById('send-btn'),
            errorModal: document.getElementById('error-modal'),
            errorMessage: document.getElementById('error-message'),
            errorContent: document.getElementById('error-content')
        };

        // Initialize Application
        async function init() {
            try {
                if (!Object.keys(FIREBASE_CONFIG).length) {
                    throw new Error("Firebase configuration is missing.");
                }

                app = initializeApp(FIREBASE_CONFIG);
                db = getFirestore(app);
                auth = getAuth(app);

                // Strictly follow Rule 3: Auth First
                if (INITIAL_TOKEN) {
                    await signInWithCustomToken(auth, INITIAL_TOKEN);
                } else {
                    await signInAnonymously(auth);
                }
                
                currentUser = auth.currentUser;
                if (!currentUser) throw new Error("Authentication failed to return a user.");

                await checkUserProfile();

            } catch (error) {
                console.error("Initialization error:", error);
                showError("Could not connect to MommyChat servers. Please try again later.");
                // Hide loading to show error clearly
                screens.loading.style.opacity = '0';
                setTimeout(() => { screens.loading.classList.add('hidden'); }, 500);
            }
        }

        // Profile Management (Private Data - Rule 1)
        async function checkUserProfile() {
            if (!currentUser) return;

            try {
                const profileRef = doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'profile', 'data');
                const profileSnap = await getDoc(profileRef);

                if (profileSnap.exists()) {
                    userProfile = profileSnap.data();
                    startApp();
                } else {
                    showScreen('setup');
                }
            } catch (error) {
                console.error("Error checking profile:", error);
                showError("Failed to load your profile.");
            }
        }

        async function saveUserProfile(displayName) {
            if (!currentUser) return;
            
            try {
                // Show loading state on button
                const btn = elements.setupForm.querySelector('button');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<div class="spinner border-t-white w-5 h-5 border-2"></div>';
                btn.disabled = true;

                const profileRef = doc(db, 'artifacts', APP_ID, 'users', currentUser.uid, 'profile', 'data');
                const newData = {
                    displayName: displayName,
                    createdAt: serverTimestamp(),
                    colorClass: getRandomColorClass() // Assign a random pastel color for their avatar
                };
                
                await setDoc(profileRef, newData);
                userProfile = newData;
                startApp();

            } catch (error) {
                console.error("Error saving profile:", error);
                showError("Could not save your profile. Please try again.");
                const btn = elements.setupForm.querySelector('button');
                btn.innerHTML = 'Join the Chat <i class="ph-bold ph-arrow-right ml-2 text-lg"></i>';
                btn.disabled = false;
            }
        }

        // Main App Logic
        function startApp() {
            elements.headerUsername.textContent = userProfile.displayName;
            showScreen('app');
            listenForMessages();
        }

        // Real-time Messages (Public Data - Rule 1 & Simple Query - Rule 2)
        function listenForMessages() {
            if (!currentUser) return;
            if (messagesUnsubscribe) messagesUnsubscribe(); // Clean up existing

            const messagesRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'messages');
            
            // Note: NO orderBy or limit here per Rule 2. Fetch all, sort in memory.
            messagesUnsubscribe = onSnapshot(messagesRef, (snapshot) => {
                const messages = [];
                snapshot.forEach((doc) => {
                    messages.push({ id: doc.id, ...doc.data() });
                });

                // Sort in memory by timestamp
                messages.sort((a, b) => {
                    const timeA = a.createdAt ? a.createdAt.toMillis() : Date.now();
                    const timeB = b.createdAt ? b.createdAt.toMillis() : Date.now();
                    return timeA - timeB;
                });

                renderMessages(messages);
            }, (error) => {
                console.error("Error listening to messages:", error);
                // Don't show modal for snapshot errors as they might be transient, just log
            });
        }

        async function handleSendMessage(e) {
            e.preventDefault();
            if (!currentUser || !userProfile) return;

            const text = elements.messageInput.value.trim();
            if (!text) return;

            // Optimistic UI clear
            elements.messageInput.value = '';
            elements.messageInput.style.height = 'auto'; // reset height
            elements.sendBtn.disabled = true;
            elements.messageInput.focus();

            try {
                const messagesRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'messages');
                await addDoc(messagesRef, {
                    text: text,
                    authorId: currentUser.uid,
                    authorName: userProfile.displayName,
                    authorColor: userProfile.colorClass || 'bg-gray-200',
                    createdAt: serverTimestamp()
                });
            } catch (error) {
                console.error("Error sending message:", error);
                showError("Failed to send message.");
                // Restore input on failure
                elements.messageInput.value = text;
            }
        }

        // Rendering Logic
        function renderMessages(messages) {
            // Keep the intro text if empty
            if (messages.length === 0) {
                 elements.messagesContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-center p-6 text-gray-400">
                        <i class="ph-fill ph-chat-circle-dots text-6xl text-pink-200 mb-4"></i>
                        <p class="text-sm">It's quiet here.<br>Be the first mom to say hello!</p>
                    </div>
                `;
                return;
            }

            // Clear container (except maybe the intro marker, but let's just rebuild)
            let html = '';
            let lastAuthorId = null;
            let lastDateStr = null;

            messages.forEach((msg, index) => {
                const isMine = currentUser && msg.authorId === currentUser.uid;
                const showAuthor = !isMine && msg.authorId !== lastAuthorId;
                
                // Group by date logic (simple in-memory formatting)
                const msgDate = msg.createdAt ? msg.createdAt.toDate() : new Date();
                const dateStr = msgDate.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
                const timeStr = msgDate.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });

                if (dateStr !== lastDateStr) {
                    html += `
                        <div class="flex justify-center my-4">
                            <span class="text-[10px] font-bold tracking-wider text-gray-400 uppercase bg-gray-50 px-3 py-1 rounded-full border border-gray-100">${dateStr}</span>
                        </div>
                    `;
                    lastDateStr = dateStr;
                }

                // Bubble styling
                const bubbleBaseClass = "msg-enter relative max-w-[85%] px-4 py-2.5 text-[15px] leading-relaxed shadow-sm break-words";
                let bubbleClass, wrapperClass, nameHtml = "";

                if (isMine) {
                    wrapperClass = "flex justify-end mb-2";
                    bubbleClass = `${bubbleBaseClass} bg-gradient-to-br from-rose-500 to-pink-500 text-white rounded-2xl rounded-tr-sm`;
                } else {
                    wrapperClass = `flex justify-start ${showAuthor ? 'mt-4 mb-2' : 'mb-2'}`;
                    bubbleClass = `${bubbleBaseClass} bg-white border border-pink-100 text-gray-800 rounded-2xl rounded-tl-sm`;
                    
                    if (showAuthor) {
                        const initial = msg.authorName ? msg.authorName.charAt(0).toUpperCase() : '?';
                        const colorClass = msg.authorColor || 'bg-teal-400';
                        nameHtml = `
                            <div class="flex items-center gap-2 mb-1 ml-1">
                                <div class="w-6 h-6 rounded-full ${colorClass} flex items-center justify-center text-white text-xs font-bold shadow-sm">
                                    ${initial}
                                </div>
                                <span class="text-xs font-bold text-gray-500">${escapeHtml(msg.authorName)}</span>
                            </div>
                        `;
                    }
                }

                html += `
                    <div class="${wrapperClass}">
                        <div class="flex flex-col ${isMine ? 'items-end' : 'items-start'} max-w-full">
                            ${nameHtml}
                            <div class="${bubbleClass}" style="animation-delay: ${isFirstLoad ? index * 0.05 : 0}s">
                                ${escapeHtml(msg.text).replace(/\n/g, '<br>')}
                            </div>
                            <span class="text-[10px] text-gray-400 mt-1 mx-1 ${isMine ? 'text-right' : 'text-left'}">${timeStr}</span>
                        </div>
                    </div>
                `;
                
                lastAuthorId = msg.authorId;
            });

            elements.messagesContainer.innerHTML = html;

            // Scroll to bottom
            scrollToBottom();
            isFirstLoad = false;
        }

        function scrollToBottom() {
            // Use setTimeout to ensure DOM has painted
            setTimeout(() => {
                elements.messagesContainer.scrollTop = elements.messagesContainer.scrollHeight;
            }, 50);
        }

        // Utility Functions
        function showScreen(screenName) {
            // Fade out current active screens
            Object.values(screens).forEach(screen => {
                if (!screen.classList.contains('hidden')) {
                    screen.style.opacity = '0';
                    setTimeout(() => {
                        screen.classList.add('hidden');
                    }, 500);
                }
            });

            // Fade in target screen
            setTimeout(() => {
                const target = screens[screenName];
                target.classList.remove('hidden');
                // Trigger reflow
                void target.offsetWidth;
                target.style.opacity = '1';
                
                if (screenName === 'setup') elements.displayNameInput.focus();
                if (screenName === 'app') scrollToBottom();
            }, 500);
        }

        function showError(message) {
            elements.errorMessage.textContent = message;
            elements.errorModal.classList.remove('hidden');
            elements.errorModal.classList.add('flex');
            // Animate in
            setTimeout(() => {
                elements.errorModal.style.opacity = '1';
                elements.errorContent.classList.remove('scale-95');
                elements.errorContent.classList.add('scale-100');
            }, 10);
        }

        window.hideError = function() {
            elements.errorModal.style.opacity = '0';
            elements.errorContent.classList.remove('scale-100');
            elements.errorContent.classList.add('scale-95');
            setTimeout(() => {
                elements.errorModal.classList.add('hidden');
                elements.errorModal.classList.remove('flex');
            }, 300);
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        function getRandomColorClass() {
            const colors = ['bg-pink-400', 'bg-rose-400', 'bg-teal-400', 'bg-purple-400', 'bg-orange-400', 'bg-indigo-400'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        // Event Listeners
        elements.setupForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = elements.displayNameInput.value.trim();
            if (name.length >= 2) {
                saveUserProfile(name);
            }
        });

        elements.messageForm.addEventListener('submit', handleSendMessage);

        // Auto-resize textarea and manage submit button state
        elements.messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            
            if (this.value.trim().length > 0) {
                elements.sendBtn.disabled = false;
                elements.sendBtn.classList.add('shadow-lg');
            } else {
                elements.sendBtn.disabled = true;
                elements.sendBtn.classList.remove('shadow-lg');
            }
        });

        // Enter to send (Shift+Enter for new line)
        elements.messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!elements.sendBtn.disabled) {
                    elements.messageForm.dispatchEvent(new Event('submit'));
                }
            }
        });

        // Start initialization when DOM is ready
        document.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
